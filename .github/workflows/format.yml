name: Check formatting

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install formatters
        run: python -m pip install clang-format==23.1.2 black==26.5.1

      - name: Format C++ files
        run: git ls-files -z -- '*.cpp' '*.hpp' | xargs -0 -r clang-format -i --style=file --

      - name: Format Python files
        run: git ls-files -z -- '*.py' | xargs -0 -r black --

      - name: Check for formatting changes
        run: git diff --exit-code
