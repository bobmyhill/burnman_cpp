name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  cpp:
    name: C++ tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake g++ catch2 libeigen3-dev libgsl-dev \
            libcdd-dev libgmp-dev libnlopt-cxx-dev

      - name: Configure C++ tests
        run: |
          cmake -S . -B build/ci-cpp \
            -DCMAKE_BUILD_TYPE=Release \
            -DBURNMAN_BUILD_PYTHON=OFF \
            -DBURNMAN_BUILD_TESTS=ON \
            -DBURNMAN_WARNINGS_AS_ERRORS=ON

      - name: Build C++ tests
        run: cmake --build build/ci-cpp --parallel 2

      - name: Run C++ unit tests
        run: ctest --test-dir build/ci-cpp --output-on-failure

  python:
    name: Python ${{ matrix.python-version }} tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.14"]
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: "2"
      MPLBACKEND: Agg
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Configure plotting environment
        run: echo "MPLCONFIGDIR=$RUNNER_TEMP/matplotlib" >> "$GITHUB_ENV"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake g++ libeigen3-dev libgsl-dev \
            libcdd-dev libgmp-dev libnlopt-cxx-dev

      - name: Build and install Python package
        run: python -m pip install '.[test,examples]' -Ccmake.define.BURNMAN_WARNINGS_AS_ERRORS=ON

      # Keep the ordinary package jobs independent of the optional reference.
      - name: Run Python package tests
        run: python -m pytest -q -ra python/tests

  reference:
    name: Pinned Python BurnMan reference
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: "2"
      MPLBACKEND: Agg
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Configure plotting environment
        run: echo "MPLCONFIGDIR=$RUNNER_TEMP/matplotlib" >> "$GITHUB_ENV"

      - name: Check out reference BurnMan
        uses: actions/checkout@v7
        with:
          repository: geodynamics/burnman
          ref: 39b582cd23954fabd3bdbbee6526a522b1d97bc9
          path: build/python-burnman-reference
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            build/python-burnman-reference/pyproject.toml

      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake g++ clang-format libeigen3-dev libgsl-dev \
            libcdd-dev libgmp-dev libnlopt-cxx-dev

      - name: Install wrapper and reference dependencies
        run: |
          python -m pip install '.[test,examples]' -Ccmake.define.BURNMAN_WARNINGS_AS_ERRORS=ON
          python -m pip install -e 'build/python-burnman-reference[dev]'

      - name: Audit stored reference values and mineral catalogue
        env:
          PYTHONPATH: ${{ github.workspace }}/build/python-burnman-reference
        run: |
          python tools/check_reference_data.py
          python tools/export_example_minerals.py --check
          python tools/generate_ps1994_reference.py --reference build/python-burnman-reference

      - name: Run complete Python suite with the pinned reference
        env:
          PYTHONPATH: ${{ github.workspace }}/build/python-burnman-reference
        run: python -m pytest -q -ra python/tests
