name: Wheels

on:
  push:
    branches: [main]
    paths:
      - CMakeLists.txt
      - pyproject.toml
      - src/**
      - include/**
      - python/**
      - tools/build_wheel_dependencies.py
      - .github/workflows/wheels.yml

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  sdist:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install build twine
      - run: python -m build --sdist
      - run: python -m twine check --strict dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: dist/*.tar.gz

  wheels:
    needs: sdist
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    env:
      CIBW_ARCHS: native
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: sdist
          path: dist
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install cibuildwheel==4.3.1
      # Build from the archive users receive, not from a developer checkout.
      - run: python -m cibuildwheel dist/*.tar.gz --output-dir wheelhouse
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*.whl
