[build-system]
requires = ["scikit-build-core>=0.11", "pybind11>=3.0"]
build-backend = "scikit_build_core.build"

[project]
name = "burnman_cpp"
version = "0.7.0"
authors = [{name = "The BurnMan Team", email = "bob.myhill@bristol.ac.uk"}]
description = "Python bindings for the BurnMan C++ mineral physics library"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
dependencies = ["numpy>=1.23", "scipy>=1.9"]
classifiers = [
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
]

[project.optional-dependencies]
test = ["pytest>=7"]
examples = ["matplotlib>=3.6"]
reference = ["burnman>=2.1", "h5py>=3.8"]

[tool.scikit-build]
minimum-version = "0.11"
cmake.version = ">=3.18"
build-dir = "build/python/{wheel_tag}"
wheel.packages = ["python/burnman_cpp"]
sdist.include = [
  "/CMakeLists.txt", "/cmake/*.cmake", "/include/**/*.hpp", "/src/**/*.cpp", "/src/**/*.hpp",
  "/python/bindings/*.cpp", "/python/bindings/*.hpp",
  "/python/burnman_cpp/**/*.py", "/python/tests/*.py", "/examples/*.py",
  "/examples/data/input_fitting/*",
  "/src/data/input_seismic/*", "/tools/export_seismic_data.py",
  "/src/data/input_geotherm/*", "/tools/export_geotherm_data.py",
  "/src/data/input_covariance/*.h5",
  "/benchmarks/dekoker_2013/*.py", "/benchmarks/dekoker_2013/README.md",
  "/benchmarks/dekoker_2013/reference/**",
  "/benchmarks/stixrude_2024_figure13/**",
  "/benchmarks/stixrude_2024_figure14/**", "/benchmarks/stixrude_2024.py",
  "/tools/export_example_minerals.py",
  "/tools/export_covariance_data.py",
  "/tools/build_wheel_dependencies.py",
]
sdist.exclude = [
  ".venv/**", "build/**", "bin/**", "*.csv", "benchmark-report.xml", "**/__pycache__/**",
  "/benchmarks/dekoker_2013/results/**",
]

[tool.pytest.ini_options]
testpaths = ["python/tests"]

[tool.black]
target-version = ["py310"]

[tool.cibuildwheel]
build = "cp3{10,11,12,13,14,15}-*"
skip = "*-musllinux_* *-win*"
test-extras = ["test"]
test-command = "python -m pytest {project}/python/tests/test_wheel_metadata.py {project}/python/tests/test_bindings.py {project}/python/tests/test_chemistry.py {project}/python/tests/test_covariance.py {project}/python/tests/test_linear_fitting.py {project}/python/tests/test_composition_fitting.py {project}/python/tests/test_thermobarometry.py {project}/python/tests/test_seismic.py {project}/python/tests/test_geotherm.py {project}/python/tests/test_layer_planet.py {project}/python/tests/test_equilibrated_composite.py {project}/python/tests/test_equilibration.py {project}/python/tests/test_stable_equilibrium.py {project}/python/tests/test_polytope.py -q"

[tool.cibuildwheel.linux]
manylinux-x86_64-image = "manylinux_2_28"
manylinux-aarch64-image = "manylinux_2_28"
before-all = "dnf install -y autoconf automake libtool && python3 {project}/tools/build_wheel_dependencies.py --prefix /tmp/burnman-wheel-deps"
environment = { CC="gcc", CXX="g++", CFLAGS="", CXXFLAGS="", LDFLAGS="", CMAKE_ARGS="-DBURNMAN_WHEEL_DEPENDENCIES=/tmp/burnman-wheel-deps", CMAKE_BUILD_PARALLEL_LEVEL="2" }

[tool.cibuildwheel.macos]
before-all = "brew install autoconf automake libtool && python3 {project}/tools/build_wheel_dependencies.py --prefix /tmp/burnman-wheel-deps"
environment = { CC="clang", CXX="clang++", CFLAGS="", CXXFLAGS="", LDFLAGS="", MACOSX_DEPLOYMENT_TARGET="11.0", CMAKE_ARGS="-DBURNMAN_WHEEL_DEPENDENCIES=/tmp/burnman-wheel-deps", CMAKE_BUILD_PARALLEL_LEVEL="2" }
